[workspace]
members = ["sqt-types", "sqt-reporter", "sqt-runner"]
resolver = "2"

[workspace.package]
authors = ["Ateleris"]
license = "ESA-PL-permissive-2.4"
repository = "https://github.com/ateleris/qsmart-sqt"
publish = false

[workspace.dependencies]
sqt-types = { path = "./sqt-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.9" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2", "charset"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
inventory = "0.3"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
