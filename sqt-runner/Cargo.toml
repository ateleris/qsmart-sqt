[package]
name = "sqt-runner"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sqt-runner"
path = "src/main.rs"

[[bin]]
name = "sqt-test-binary"
path = "src/bin/test_binary.rs"

[dependencies]
sqt-types = { workspace = true }
anyhow = "1"
tokio = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
sha1 = "0.10"
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# HTTPS listener (SRS-IF-010): rustls with the ring provider, as reqwest uses;
# no OpenSSL, so the static musl build stays self-contained.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

[dev-dependencies]
sqt-reporter = { path = "../sqt-reporter" }
tokio-util = "0.7"
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[lints]
workspace = true
