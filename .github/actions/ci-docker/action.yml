name: Run in CI build image
description: >
  Build the ci image on the dind daemon (cached) and run a command inside it,
  with the workspace shared and persistent cargo + target caches mounted.

inputs:
  run:
    description: Command to run inside the build image (cwd = repo checkout).
    required: true
  docker-socket:
    description: >-
      Mount the dind daemon's socket so the command can start containers
      (paths under the checkout are the same for the job and the daemon).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Cached in dind's storage: an unchanged Dockerfile is an instant hit.
    - name: Build CI image
      shell: bash
      run: docker build -t ats-sqt-ci:latest - < ci/Dockerfile

    - name: Run
      shell: bash
      env:
        RUN: ${{ inputs.run }}
        DOCKER_SOCKET: ${{ inputs.docker-socket }}
      run: |
        socket=()
        if [ "$DOCKER_SOCKET" = "true" ]; then
          socket=(-v /var/run/docker.sock:/var/run/docker.sock)
        fi
        docker run --rm "${socket[@]}" \
          -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE" \
          -v sqt-cargo-registry:/usr/local/cargo/registry \
          -v sqt-cargo-git:/usr/local/cargo/git \
          -v sqt-target:/cache/target \
          -e CARGO_TARGET_DIR=/cache/target \
          -e CARGO_TERM_COLOR=always \
          ats-sqt-ci:latest \
          bash -c "$RUN"
