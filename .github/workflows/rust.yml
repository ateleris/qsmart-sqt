name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

# Each job runs in the dind build image via the local composite action. Jobs are
# independent (no `needs`) so they parallelize across runners; on a single
# ephemeral runner they simply serialize. The cargo + target caches are shared
# dind volumes, so compilation is reused across jobs and runs.
jobs:
  rustfmt:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-docker
        with:
          run: >-
            cargo fmt --all -- --check ||
            { echo "::error title=rustfmt::Formatting issues found — run 'cargo fmt --all' to fix."; exit 1; }

  clippy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-docker
        with:
          run: cargo clippy --workspace --all-targets -- -D warnings

  # Licences, bans and sources (cargo-deny), security advisories (cargo-audit)
  # and the CycloneDX SBOM of each delivered binary.
  supply-chain:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-docker
        with:
          run: bash ci/supply-chain.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.cdx.json

  # The Orchestrator against the real reference Runner, which runs the binary
  # under test in Docker (SRS-QUAL-003, SRS-VAL-001).
  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-docker
        with:
          docker-socket: "true"
          run: >-
            SQT_E2E_WORKDIR="$PWD/e2e-work"
            cargo test --locked -p sqt-runner --test e2e_test -- --ignored

  test:
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write          # dorny/test-reporter publishes a Check Run
      pull-requests: write    # ...and annotates the PR diff
    steps:
      - uses: actions/checkout@v6

      # Builds with coverage instrumentation, runs the suite, and emits
      # junit.xml + coverage.json + coverage-summary.md (all coupled via llvm-cov).
      - uses: ./.github/actions/ci-docker
        with:
          run: bash ci/run-tests.sh

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload fulfilment matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulfilment-matrix
          path: fulfilment-matrix.*
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage-summary.md ]; then
            cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Coverage summary unavailable._" >> "$GITHUB_STEP_SUMMARY"
          fi
