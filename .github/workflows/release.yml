name: Release

# Runs on a pushed version tag. Re-runs every gate, then builds the static
# binaries, the two container images, the SBOMs and the source archive,
# records their SHA-256 values, writes the release notes (ci/release-notes.py)
# and opens a *draft* GitHub release with them.
# The draft is published by hand after review.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write        # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # full history, so the annotated tag object is present

      - name: Check the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "::error::$tag is a lightweight tag; releases need an annotated, signed tag (SRS-CDR-001)"
            exit 1
          fi
          if ! git cat-file tag "refs/tags/$tag" | grep -q -- '-----BEGIN \(PGP\|SSH\) SIGNATURE-----'; then
            echo "::error::$tag is not signed (SRS-CDR-001)"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct "$tag")" >> "$GITHUB_OUTPUT"

      - name: Lint
        uses: ./.github/actions/ci-docker
        with:
          run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests, coverage gate (Orchestrator ≥ 80 % lines) and requirements gate
        uses: ./.github/actions/ci-docker
        with:
          run: >-
            COVERAGE_FAIL_UNDER=80 MATRIX_GATE=${{ steps.tag.outputs.version }}
            bash ci/run-tests.sh

      - name: Fulfilment summary
        if: always()
        run: |
          if [ -f fulfilment-summary.md ]; then
            cat fulfilment-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: End-to-end against the reference Runner (SRS-QUAL-003)
        uses: ./.github/actions/ci-docker
        with:
          docker-socket: "true"
          run: >-
            SQT_E2E_WORKDIR="$PWD/e2e-work"
            cargo test --locked -p sqt-runner --test e2e_test -- --ignored

      - name: Dependency gates and SBOM
        uses: ./.github/actions/ci-docker
        with:
          run: bash ci/supply-chain.sh

      - name: Build static binaries
        uses: ./.github/actions/ci-docker
        with:
          run: >-
            SOURCE_DATE_EPOCH=${{ steps.tag.outputs.epoch }}
            bash ci/release-build.sh ${{ steps.tag.outputs.version }}

      - name: Build container images
        env:
          SOURCE_DATE_EPOCH: ${{ steps.tag.outputs.epoch }}
        run: bash ci/release-images.sh ${{ steps.tag.outputs.version }}

      - name: Source archive and checksums
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git archive --format=tar --prefix="qsmart-sqt-$VERSION/" "$GITHUB_REF_NAME" \
            | gzip -n -9 > "dist/qsmart-sqt-$VERSION-src.tar.gz"
          cp fulfilment-matrix.json "dist/fulfilment-matrix-$VERSION.json"
          cp fulfilment-matrix.md "dist/fulfilment-matrix-$VERSION.md"
          cd dist
          sha256sum -- *.tar.gz *.cdx.json fulfilment-matrix-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo
            echo '```'
            cat SHA256SUMS
            echo
            cat IMAGES.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The git history is read here, on the runner, because the build image
      # has no git; the notes themselves are written inside the image.
      - name: Changes since the previous release
        id: changes
        run: |
          tag="${GITHUB_REF_NAME}"
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^" 2>/dev/null || true)
          range="$tag"
          [ -n "$previous" ] && range="$previous..$tag"
          git log --first-parent --merges --format='%s%x00%b%x1e' "$range" > release-changes.txt
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Release notes
        uses: ./.github/actions/ci-docker
        with:
          run: >-
            python3 ci/release-notes.py
            --tag "${{ github.ref_name }}" --commit "${{ github.sha }}"
            --epoch "${{ steps.tag.outputs.epoch }}"
            --previous "${{ steps.changes.outputs.previous }}"
            --changes release-changes.txt
            --matrix fulfilment-matrix.json --coverage coverage-orchestrator.json
            --sums dist/SHA256SUMS --images dist/IMAGES.txt
            --out "dist/RELEASE_NOTES-${{ steps.tag.outputs.version }}.md"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SQT ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES-${{ steps.tag.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/fulfilment-matrix-*
            dist/SHA256SUMS
            dist/IMAGES.txt
            dist/RELEASE_NOTES-*.md
