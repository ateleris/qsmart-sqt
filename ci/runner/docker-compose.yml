# Self-hosted GitHub Actions runner for ats-sqt, with an isolated
# Docker-in-Docker daemon (GitLab docker-executor style).
#
#   dind    - privileged Docker daemon; build/analysis containers run here,
#             isolated from the host daemon. Image cache persists across jobs.
#   runner  - thin agent (myoung34/github-runner). Registers to the repo and
#             talks to dind over its plaintext TCP socket on the private `ci`
#             network. The toolchain is NOT here — jobs launch the ci build
#             image via `docker run` (see .github/workflows/rust.yml).
#
# Deploy:  cp .env.example .env  &&  edit it  &&  docker compose up -d
services:
  dind:
    image: docker:dind
    privileged: true                       # required for Docker-in-Docker
    environment:
      DOCKER_TLS_CERTDIR: ""               # empty -> no TLS; listen on tcp://0.0.0.0:2375.
                                           # Safe: the socket is only on the private `ci`
                                           # network, never exposed to host or internet.
    volumes:
      - ./runner-work:/actions-runner/_work  # MUST match the runner's path below
      - ./dind-cache:/var/lib/docker         # persistent image cache across jobs
    networks: [ci]
    restart: always

  runner:
    image: myoung34/github-runner:latest
    depends_on: [dind]
    environment:
      REPO_URL: ${REPO_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN}        # PAT; runner fetches registration tokens itself
      RUNNER_SCOPE: repo
      RUNNER_NAME: ${RUNNER_NAME:-ats-sqt-dind}
      LABELS: ${RUNNER_LABELS:-self-hosted,dind}
      DISABLE_AUTO_UPDATE: "true"          # pin to the image's runner; in-container
                                           # self-update can corrupt bin/ and, with
                                           # restart:always, loops on the broken layer
      RUNNER_WORKDIR: /actions-runner/_work
      # Point the runner's docker CLI at the dind daemon (plaintext TCP, no certs).
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ./runner-work:/actions-runner/_work  # same path as dind -> shared checkout
    networks: [ci]
    restart: always

networks:
  ci:
