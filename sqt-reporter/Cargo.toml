[package]
name = "sqt-reporter"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sqt_reporter"
path = "src/lib.rs"

[[bin]]
name = "sqt-reporter"
path = "src/main.rs"

[dependencies]
sqt-types = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
anyhow = "1"
tokio = { workspace = true, features = ["time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
walkdir = "2"
sha2 = "0.11"
base64 = "0.22"
printpdf = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# A TLS test server for the Runner CA certificate (SRS-IF-010); the same
# rustls/ring stack reqwest already uses, so no new crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
