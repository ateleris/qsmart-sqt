openapi: "3.1.0"

info:
  title: SQT Job API
  description: |
    Generic REST API for submitting AI model qualification jobs and polling their results.

    ## Single-Endpoint Design

    All qualification work - execution, instrumented runs, static analysis,
    and coverage - is submitted through a single job endpoint.
    Clients supply:

    - **Which workload** to run (`model` field - one of the predefined workload types)
    - **What input** to feed it (workload-specific: images, tabular data, time series,
      or a server-side dataset reference)
    - **How many times** to repeat (`repetitions`)
    - **What instrumentation** to attach (`instrumentation`: none / asan / valgrind / gprof / to be refined)
    - **Which measurement mode** to use (`mode`: latency or throughput)

    The server returns everything it can measure in a fixed schema; fields that
    are unavailable are `null`. SQT Generic treats a null metric as a failed
    constraint when a spec references it.

    ## Predefined Workload Types

    | Workload | Typical Input | Typical Output |
    |---|---|---|
    | `object_detection` | Images | Bounding boxes + labels |
    | `image_classification` | Images | Class labels + confidence scores |
    | `pixel_segmentation` | Images | Per-pixel class masks (large) |
    | `classification` | Tabular / feature vectors | Class labels |
    | `regression` | Tabular / feature vectors | Scalar predictions |
    | `time_series_forecasting` | Time series sequences | Forecast sequences |

    Large outputs (e.g. segmentation masks) are handled specially: only one
    sample run output is transferred. For all other workloads, all run outputs
    are transferred so that SQT Generic can compute accuracy metrics
    (accuracy, IoU, F1, L2, etc.) client-side.

    ## Measurement Modes

    - **`latency`** (default): each inference is timed individually.
      The response includes p50 / p95 / p99 latency percentiles.
    - **`throughput`**: the backend batches repetitions to maximise pipeline
      utilisation. The response includes throughput in items per second.

    ## Polling Pattern

    1. Submit → receive a job ID (202 Accepted)
    2. Poll `GET /api/v1/jobs/{job_id}` until `status` is `complete` or `failed`

    SQT Generic uses exponential backoff when polling (initial 1 s, x2 per
    poll, 30 s cap). Results are included directly in the GET response.

    ## CPU Utilisation Normalisation

    `cpu.avg_normalized_pct` is always normalised server-side:

        cpu.avg_normalized_pct = (average CPU used across all cores) / (core_count * 100) * 100

    100% means all available compute was fully saturated. This is unambiguous
    regardless of whether the target is a CPU, GPU, or FPGA. The `hardware`
    descriptor in the response provides the raw core count and hardware type
    for users who want to reconstruct per-core figures.
  version: "1.0.0"
  contact:
    name: Ateleris

servers:
  - url: http://localhost:8080
    description: Local development / default

security:
  - bearerAuth: []

tags:
  - name: Jobs
    description: AI model qualification jobs

paths:

  # ---------------------------------------------------------------------------
  # Job submission
  # ---------------------------------------------------------------------------

  /api/v1/jobs:
    post:
      operationId: submitJob
      summary: Submit a qualification job
      description: |
        Submits a qualification job for the server's configured binary.
        The client specifies the workload type, input data, repetition count,
        instrumentation mode, and measurement mode.

        The server returns a job ID for polling.

        Static analysis (sonar, binary size, static warnings) is performed
        once per session and included in the first `complete` response.
        Subsequent jobs in the same session reuse the cached analysis result.
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
            examples:
              image_classification_latency:
                summary: Image classification, 10 repetitions, latency mode
                value:
                  model: image_classification
                  input:
                    type: images
                    images:
                      - "<base64-encoded-image>"
                  repetitions: 10
                  instrumentation: none
                  mode: latency
                  timeout_secs: 60
              object_detection_valgrind:
                summary: Object detection with Valgrind, dataset reference
                value:
                  model: object_detection
                  input:
                    type: dataset_ref
                    dataset_ref: "datasets/coco_val2017_sample"
                  repetitions: 5
                  instrumentation: valgrind
                  mode: latency
                  timeout_secs: 300
              regression_throughput:
                summary: Regression model, throughput mode
                value:
                  model: regression
                  input:
                    type: tabular
                    data:
                      - [1.0, 2.3, 0.7]
                      - [4.1, 0.9, 3.2]
                  repetitions: 100
                  instrumentation: none
                  mode: throughput
                  timeout_secs: 120
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
              example:
                job_id: "job-abc123"
                status: "accepted"
                created_at: "2026-03-06T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/jobs/{job_id}:
    get:
      operationId: getJobStatus
      summary: Get job status, metrics, and output
      description: |
        Returns the current status, all available metrics, hardware descriptor,
        and model output for the job.

        Poll with exponential backoff until `status` is `complete` or `failed`.

        A `complete` status means the binary ran to completion for all
        repetitions; individual metric fields may still be `null` if the
        corresponding tool was unavailable or not configured.

        A `failed` status indicates an infrastructure-level failure (e.g. the
        binary could not be launched, or the requested dataset was not found).
        The `error` field provides a human-readable description.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status, metrics, and output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
              examples:
                image_classification_complete:
                  summary: Image classification job - complete
                  value:
                    job_id: "job-abc123"
                    model: "image_classification"
                    mode: "latency"
                    repetitions: 10
                    status: "complete"
                    created_at: "2026-03-06T10:00:00Z"
                    started_at: "2026-03-06T10:00:01Z"
                    completed_at: "2026-03-06T10:00:05Z"
                    hardware:
                      type: "cpu"
                      model: "GR740 Leon4"
                      cores: 4
                      memory_total_kb: 131072
                      accelerator_model: null
                    metrics:
                      return_code: 0
                      time.avg_ms: 87.3
                      time.latency_p50_ms: 85.1
                      time.latency_p95_ms: 99.2
                      time.latency_p99_ms: 103.4
                      time.throughput_fps: null
                      memory.avg_rss_kb: 3200.0
                      memory.peak_rss_kb: 4096.0
                      memory.leaks_bytes: 0
                      cpu.avg_normalized_pct: 24.3
                      coverage.line_pct: 87.2
                      coverage.branch_pct: 72.1
                      coverage.function_pct: 95.0
                      coverage.lines_covered: 1234
                      coverage.lines_total: 1416
                      static.warnings: 1
                      static.critical_issues: 0
                      static.major_issues: 3
                      binary.size_kb: 412.0
                    output:
                      type: "classification_labels"
                      result_consistent: true
                      outputs:
                        - {label: "spacecraft", confidence: 0.983}
                        - {label: "solar_panel", confidence: 0.971}
                      outputs_checksum: "a3f1c2d4e5b6..."
                pixel_segmentation_complete:
                  summary: Pixel segmentation - large output, only sample transferred
                  value:
                    job_id: "job-def456"
                    model: "pixel_segmentation"
                    mode: "latency"
                    repetitions: 5
                    status: "complete"
                    created_at: "2026-03-06T10:01:00Z"
                    started_at: "2026-03-06T10:01:01Z"
                    completed_at: "2026-03-06T10:01:30Z"
                    hardware:
                      type: "gpu"
                      model: "NVIDIA Jetson Xavier"
                      cores: 512
                      memory_total_kb: 16777216
                      accelerator_model: "Volta GPU"
                    metrics:
                      return_code: 0
                      time.avg_ms: 14200.0
                      time.latency_p50_ms: 14100.0
                      time.latency_p95_ms: 14800.0
                      time.latency_p99_ms: 15200.0
                      time.throughput_fps: null
                      memory.avg_rss_kb: 524288.0
                      memory.peak_rss_kb: 589824.0
                      memory.leaks_bytes: 0
                      cpu.avg_normalized_pct: 12.5
                      coverage.line_pct: null
                      coverage.branch_pct: null
                      coverage.function_pct: null
                      coverage.lines_covered: null
                      coverage.lines_total: null
                      static.warnings: null
                      static.critical_issues: null
                      static.major_issues: null
                      binary.size_kb: 8192.0
                    output:
                      type: "segmentation_masks"
                      result_consistent: true
                      outputs:
                        - "<base64-encoded-PNG-mask-image-1>"
                        - "<base64-encoded-PNG-mask-image-2>"
                      outputs_checksum: "b7e2a1f3c9d0..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token for the job API server. Pass via the `Authorization: Bearer <token>` header.

  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: Unique job identifier as returned by POST /api/v1/jobs.
      schema:
        type: string
        example: "job-abc123"


  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "unknown model type: 'depth_estimation'"
              timestamp: "2026-03-06T10:00:00Z"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Invalid or missing Bearer token"
              timestamp: "2026-03-06T10:00:00Z"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "NOT_FOUND"
              message: "Job not found: job-abc123"
              timestamp: "2026-03-06T10:00:00Z"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "Unexpected failure during metric collection"
              timestamp: "2026-03-06T10:00:00Z"

  schemas:

    # -------------------------------------------------------------------------
    # Enumerations
    # -------------------------------------------------------------------------

    WorkloadType:
      type: string
      description: |
        The type of AI workload to run. Determines how the server interprets
        the `input` field and what kind of output it produces.

        | Value | Domain | Typical input | Typical output |
        |---|---|---|---|
        | `object_detection` | Computer vision | Images | Bounding boxes + class labels |
        | `image_classification` | Computer vision | Images | Class label + confidence |
        | `pixel_segmentation` | Computer vision | Images | Per-pixel mask (large) |
        | `classification` | Tabular / ML | Feature vectors | Class label |
        | `regression` | Tabular / ML | Feature vectors | Scalar value |
        | `time_series_forecasting` | Sequential | Time series | Forecast sequence |
      enum:
        - object_detection
        - image_classification
        - pixel_segmentation
        - classification
        - regression
        - time_series_forecasting

    Instrumentation:
      type: string
      description: |
        Instrumentation framework to attach to the inference binary for this
        run. Only one may be selected per job. `none` is the default.

        - `none`: No instrumentation. Lowest overhead; used for accuracy and
          throughput/latency benchmarks.
        - `asan`: AddressSanitizer. Detects memory errors (buffer overflows,
          use-after-free). Disables `memory.leaks_bytes` (incompatible with
          Valgrind).
        - `valgrind`: Valgrind memcheck. Reports `memory.leaks_bytes`. Higher
          overhead than ASan; more complete leak analysis.
        - `gprof`: GNU profiler. Generates a flat call-graph profile; does not
          affect memory metrics.

        When instrumentation is active, timing and throughput metrics reflect
        instrumented (slower) execution and should not be compared to
        un-instrumented baselines.
      enum:
        - none
        - asan
        - valgrind
        - gprof
      default: none

    MeasurementMode:
      type: string
      description: |
        Controls how the server schedules `repetitions` and which timing
        metrics are populated.

        - **`latency`** (default): each inference call is measured
          independently. Populates `time.avg_ms`, `time.latency_p50_ms`,
          `time.latency_p95_ms`, `time.latency_p99_ms`. Leaves
          `time.throughput_fps` null.
        - **`throughput`**: the server maximises pipeline utilisation
          (batching, prefetching, parallelism as appropriate for the hardware).
          Populates `time.throughput_fps`. Latency percentile fields reflect
          end-to-end pipeline time and are less meaningful for per-item
          comparisons.
      enum:
        - latency
        - throughput
      default: latency

    OutputType:
      type: string
      description: |
        The semantic type of the model's output, determined by the workload.
        One output entry is returned per input item regardless of output type.

        | Output type | Typical workload | Per-entry schema |
        |---|---|---|
        | `classification_labels` | image_classification, classification | `{label, confidence}` |
        | `bounding_boxes` | object_detection | array of `{label, confidence, x, y, w, h}` |
        | `segmentation_masks` | pixel_segmentation | base64-encoded PNG |
        | `regression_values` | regression | number |
        | `timeseries_predictions` | time_series_forecasting | array of numbers |
        | `text` | Any text-output workload | string |
      enum:
        - classification_labels
        - bounding_boxes
        - segmentation_masks
        - regression_values
        - timeseries_predictions
        - text

    # -------------------------------------------------------------------------
    # Job input (workload-specific, discriminated by `type`)
    # -------------------------------------------------------------------------

    JobInput:
      description: |
        Workload-specific input data. The `type` field selects the schema
        variant. Use `dataset_ref` when the dataset is pre-loaded server-side
        (preferred for large datasets or repeated use across jobs).
      oneOf:
        - $ref: "#/components/schemas/ImageInput"
        - $ref: "#/components/schemas/DatasetRefInput"
        - $ref: "#/components/schemas/TabularInput"
        - $ref: "#/components/schemas/TimeSeriesInput"
      discriminator:
        propertyName: type
        mapping:
          images: "#/components/schemas/ImageInput"
          dataset_ref: "#/components/schemas/DatasetRefInput"
          tabular: "#/components/schemas/TabularInput"
          timeseries: "#/components/schemas/TimeSeriesInput"

    ImageInput:
      type: object
      required: [type, images]
      properties:
        type:
          type: string
          enum: [images]
        images:
          type: array
          minItems: 1
          description: |
            List of images to run inference on, base64-encoded. Each image
            is one inference call. For `pixel_segmentation`, the response
            returns only one sample mask - all images are still executed
            for consistency checking and metric collection.

            For large batches (hundreds or thousands of images), the request
            body will be correspondingly large. Ensure the server's HTTP
            frontend is configured to accept the required
            body size (e.g. `client_max_body_size 2g` in nginx).
          items:
            type: string
            format: byte
            description: Base64-encoded image (PNG or JPEG).

    DatasetRefInput:
      type: object
      required: [type, dataset_ref]
      properties:
        type:
          type: string
          enum: [dataset_ref]
        dataset_ref:
          type: string
          description: |
            Server-side identifier for a pre-loaded dataset. The server
            resolves this to the appropriate input files for the configured
            workload type. Format is server-defined (path, UUID, or name).
          example: "datasets/coco_val2017_sample"

    TabularInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tabular]
        data:
          type: array
          description: |
            Inline tabular data. Each element is one inference call (a row
            of feature values). Mutually exclusive with `dataset_ref`.
          items:
            type: array
            items:
              type: number
        dataset_ref:
          type: string
          description: Server-side dataset reference. Mutually exclusive with `data`.
          example: "datasets/iris_test"

    TimeSeriesInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [timeseries]
        series:
          type: array
          description: |
            Inline time series sequences. Each element is one input sequence
            (array of timestep values). Mutually exclusive with `dataset_ref`.
          items:
            type: array
            items:
              type: number
        dataset_ref:
          type: string
          description: Server-side dataset reference. Mutually exclusive with `series`.
          example: "datasets/ecg_test_sequences"

    # -------------------------------------------------------------------------
    # Job request
    # -------------------------------------------------------------------------

    JobRequest:
      type: object
      required: [model]
      properties:
        model:
          $ref: "#/components/schemas/WorkloadType"
        input:
          $ref: "#/components/schemas/JobInput"
          description: |
            Workload input. Optional when the server has a default dataset
            configured for the given workload type. Required otherwise.
        repetitions:
          type: integer
          minimum: 1
          default: 1
          description: |
            Number of times to run the inference binary. All repetitions
            use the same input. Used for timing statistics and consistency
            checking. The server collects metrics across all repetitions.
          example: 10
        instrumentation:
          $ref: "#/components/schemas/Instrumentation"
        mode:
          $ref: "#/components/schemas/MeasurementMode"
        warmup_repetitions:
          type: integer
          minimum: 0
          default: 0
          description: |
            Number of inference calls to perform before measurement begins.
            Warmup runs are not counted toward `repetitions` and their
            timing/memory results are discarded. Use this to amortise JIT
            compilation, cache population, and lazy runtime initialisation.
            Results from warmed and cold runs are NOT comparable; document
            which mode a spec uses.
          example: 3
        batch_size:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Number of inference calls to group into one forward pass. Only
            meaningful in `throughput` mode - in `latency` mode the server shall
            ignore this field and use a batch size of 1. When null, the
            server chooses the optimal batch size for the hardware.
          example: 8
        tags:
          type: object
          additionalProperties:
            type: string
          description: |
            Arbitrary key-value metadata attached to this job. Echoed back
            in the `JobStatusResponse`. Useful for correlating jobs with CI
            runs, git commits, requirement UIDs, etc. Keys and values must
            be non-empty strings
          example:
            requirement_uid: "REQ-ML-L-003"
            git_sha: "a1b2c3d"
            ci_run_id: "12345"
        timeout_secs:
          type: integer
          minimum: 1
          description: |
            Maximum wall-clock time in seconds for the entire job (all
            repetitions + warmup combined). The server aborts and returns
            `failed` if this is exceeded. Default values are chosen by the
            server based on the workflow to run.
          example: 60

    # -------------------------------------------------------------------------
    # Job response
    # -------------------------------------------------------------------------

    JobAccepted:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id:
          type: string
          description: Unique job identifier for subsequent polling.
          example: "job-abc123"
        status:
          type: string
          enum: [accepted]
          description: Always `accepted` in the 202 response.
        created_at:
          type: string
          format: date-time
          example: "2026-03-06T10:00:00Z"

    JobStatusResponse:
      type: object
      required: [job_id, model, mode, repetitions, status, created_at]
      properties:
        job_id:
          type: string
          example: "job-abc123"
        model:
          $ref: "#/components/schemas/WorkloadType"
        mode:
          $ref: "#/components/schemas/MeasurementMode"
        repetitions:
          type: integer
          description: Number of repetitions requested.
          example: 10
        status:
          $ref: "#/components/schemas/JobStatusEnum"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          description: When execution started. Absent if still queued.
        completed_at:
          type: string
          format: date-time
          description: When all repetitions finished. Present only in terminal states.
        error:
          type: string
          description: Infrastructure-level error. Present only when `status == "failed"`.
        tags:
          type: object
          additionalProperties:
            type: string
          description: |
            Key-value metadata as supplied in the request. Echoed back
            unchanged for correlation with CI systems and requirement trackers.
          example:
            requirement_uid: "REQ-ML-L-003"
            git_sha: "a1b2c3d"
        hardware:
          $ref: "#/components/schemas/HardwareInfo"
          description: |
            Descriptor for the hardware that executed the job. Populated
            once execution starts; null while still queued.
        metrics:
          $ref: "#/components/schemas/JobMetrics"
          description: |
            Aggregated metrics across all repetitions. Fields are populated
            as they become available. All fields are null while the job is
            running (unless a metric is collected incrementally).
        output:
          $ref: "#/components/schemas/JobOutput"
          description: |
            Model outputs from the repetitions. Null while the job is running.
            Populated (possibly partially) in the terminal response.

    # -------------------------------------------------------------------------
    # Hardware descriptor
    # -------------------------------------------------------------------------

    HardwareInfo:
      type: object
      description: |
        Description of the hardware that executed the job. Populated by the
        server based on its configured target. Provides context for interpreting
        normalised metrics such as `cpu.avg_normalized_pct`.
      required: [type]
      properties:
        type:
          type: string
          enum: [cpu, gpu, fpga, npu, other]
          description: Primary compute element type.
          example: "cpu"
        model:
          type: string
          description: Human-readable hardware model name.
          example: "GR740 Leon4"
        cores:
          type: integer
          nullable: true
          description: |
            Number of compute units (CPU cores, GPU CUDA cores, FPGA logic
            blocks, etc.). Used to interpret `cpu.avg_normalized_pct`.
          example: 4
        memory_total_kb:
          type: integer
          nullable: true
          description: Total available memory in kilobytes.
          example: 131072
        accelerator_model:
          type: string
          nullable: true
          description: |
            Name of an attached accelerator (e.g. "Myriad X", "Volta GPU").
            Null when the primary compute element handles inference directly.
          example: null
        clock_mhz:
          type: number
          format: double
          nullable: true
          description: |
            Primary compute element clock speed in MHz. Essential context for
            interpreting timing metrics (e.g. GR740 Leon4 @ 250 MHz).
            Null if the server cannot determine clock speed.
          example: 250.0
        os:
          type: string
          nullable: true
          description: |
            Operating system or runtime environment on the target.
            Examples: `"RTEMS 6"`, `"Linux 6.8"`, `"baremetal"`, `"FreeRTOS 11"`.
            Null if not determinable.
          example: "RTEMS 6"

    # -------------------------------------------------------------------------
    # Metrics (aggregated across all repetitions)
    # -------------------------------------------------------------------------

    JobMetrics:
      type: object
      description: |
        Fixed-schema metrics aggregated across all repetitions.
        All fields are always present in a terminal response. `null` means the
        metric was not available for this job (tool not installed or not
        configured, binary not instrumented, etc.).

        Timing fields depend on `mode`:
        - In `latency` mode: `time.avg_ms` and latency percentiles are populated;
          `time.throughput_fps` is null.
        - In `throughput` mode: `time.throughput_fps` is populated; latency
          percentiles reflect pipeline end-to-end time.

        `cpu.avg_normalized_pct` is normalised server-side:
          value = (average CPU across all cores) / (core_count * 100) * 100
        100 % = all available compute saturated.
        See `hardware.cores` for the raw core count.
      properties:
        return_code:
          type: integer
          nullable: true
          description: |
            Process exit code of the last repetition. 0 = success.
            Non-zero does not automatically fail the job - the constraint
            evaluator checks this separately.
          example: 0

        time.avg_ms:
          type: number
          format: double
          nullable: true
          description: Average wall-clock execution time per repetition, in milliseconds.
          example: 87.3

        time.latency_p50_ms:
          type: number
          format: double
          nullable: true
          description: |
            50th percentile (median) latency across repetitions, in milliseconds.
            Null in `throughput` mode or when `repetitions < 2`.
          example: 85.1

        time.latency_p95_ms:
          type: number
          format: double
          nullable: true
          description: |
            95th percentile latency across repetitions, in milliseconds.
            Null in `throughput` mode or when `repetitions < 20`.
          example: 99.2

        time.latency_p99_ms:
          type: number
          format: double
          nullable: true
          description: |
            99th percentile latency across repetitions, in milliseconds.
            Null in `throughput` mode or when `repetitions < 100`.
          example: 103.4

        time.throughput_fps:
          type: number
          format: double
          nullable: true
          description: |
            Throughput in inferences per second. Populated in `throughput`
            mode only. Null in `latency` mode.
          example: null

        memory.avg_rss_kb:
          type: number
          format: double
          nullable: true
          description: |
            Average resident set size across repetitions, in kilobytes.
          example: 3200.0

        memory.peak_rss_kb:
          type: number
          format: double
          nullable: true
          description: |
            Peak resident set size observed across all repetitions, in kilobytes.
          example: 4096.0

        memory.leaks_bytes:
          type: integer
          nullable: true
          description: |
            Total bytes leaked according to Valgrind memcheck or ASan.
            0 = no leaks detected.
            Null if `instrumentation` is `none` or `gprof`.
          example: 0

        cpu.avg_normalized_pct:
          type: number
          format: double
          nullable: true
          description: |
            Average CPU utilisation normalised to total available compute.
            Formula: (avg CPU used across all cores) / (core_count * 100) * 100
            100 % = all cores fully saturated throughout the run.
            See `hardware.cores` for the raw core count.
            Null if the target hardware does not expose CPU counters.
          example: 24.3

        coverage.line_pct:
          type: number
          format: double
          nullable: true
          description: |
            Line coverage percentage (0–100). Requires the binary to be
            compiled with coverage instrumentation (gcov/llvm-cov).
            Null if the binary is not instrumented.
          example: 87.2

        coverage.branch_pct:
          type: number
          format: double
          nullable: true
          description: Branch coverage percentage (0–100). Null if not instrumented.
          example: 72.1

        coverage.function_pct:
          type: number
          format: double
          nullable: true
          description: Function coverage percentage (0–100). Null if not instrumented.
          example: 95.0

        coverage.lines_covered:
          type: integer
          nullable: true
          description: Absolute number of source lines executed. Null if not instrumented.
          example: 1234

        coverage.lines_total:
          type: integer
          nullable: true
          description: Total number of instrumented source lines. Null if not instrumented.
          example: 1416

        static.warnings:
          type: integer
          nullable: true
          description: |
            Total warnings from static analysers (cppcheck, clang-tidy, etc.).
            Collected once per session; null if no static analyser is configured.
          example: 1

        static.critical_issues:
          type: integer
          nullable: true
          description: |
            Count of CRITICAL-severity SonarQube issues.
            Null if SonarQube is not configured or unreachable.
          example: 0

        static.major_issues:
          type: integer
          nullable: true
          description: |
            Count of MAJOR-severity SonarQube issues.
            Null if SonarQube is not configured or unreachable.
          example: 3

        binary.size_kb:
          type: number
          format: double
          nullable: true
          description: Binary size on disk in kilobytes.
          example: 412.0

        time.startup_ms:
          type: number
          format: double
          nullable: true
          description: |
            Time from process start to first inference call, in milliseconds.
            Captures model loading, runtime initialisation, and memory
            allocation. Measured once (not averaged across repetitions).
            Null if the server cannot isolate startup from inference time.
          example: 312.5

        time.first_inference_ms:
          type: number
          format: double
          nullable: true
          description: |
            Wall-clock time of the very first inference call (cold path),
            in milliseconds. Differs from `time.avg_ms` when JIT compilation
            or lazy initialisation is involved. Null if not separately
            measurable (e.g. when `warmup_repetitions > 0` hides the cold path).
          example: 145.2

        memory.stack_kb:
          type: number
          format: double
          nullable: true
          description: |
            Peak stack usage in kilobytes. Critical for RTEMS/baremetal targets
            with fixed stack allocations. Null if the platform does not expose
            stack instrumentation.
          example: 48.0

        memory.heap_allocations:
          type: integer
          nullable: true
          description: |
            Total number of heap allocation calls (malloc/new) across all
            repetitions. Safety-critical and real-time code often requires
            zero dynamic allocation after initialisation. Null if not
            instrumented.
          example: 0

        power.avg_watts:
          type: number
          format: double
          nullable: true
          description: |
            Average power draw during inference, in watts. Null if the
            target hardware does not expose power monitoring.
          example: 4.2

        power.peak_watts:
          type: number
          format: double
          nullable: true
          description: |
            Peak power draw observed across all repetitions, in watts.
            Null if the target hardware does not expose power monitoring.
          example: 5.8

        hardware.temperature_celsius:
          type: number
          format: double
          nullable: true
          description: |
            Average die/board temperature during the run, in degrees Celsius.
            Null if the target does not expose temperature sensors.
          example: 52.3

    # -------------------------------------------------------------------------
    # Model output
    # -------------------------------------------------------------------------

    JobOutput:
      type: object
      required: [type, result_consistent]
      description: |
        Model outputs from the qualification run.

        `outputs` always contains **one result per input item** in the batch -
        never one result per repetition. Repetitions exist for statistical
        measurement only; they do not produce additional output entries.

        For all workload types (including `pixel_segmentation`), the server
        executes all `repetitions` but transfers the output batch only once.
        `result_consistent` records whether every repetition produced
        bit-identical results.

        SQT Generic uses `outputs` to compute accuracy metrics (accuracy, F1,
        IoU, L2, etc.) client-side against reference labels attached to the spec.

        Output schema per entry depends on `type`:
        - `classification_labels`: `{label: string, confidence: number}`
        - `bounding_boxes`: array of `{label, confidence, x, y, w, h}`
        - `segmentation_masks`: base64-encoded PNG mask
        - `regression_values`: number
        - `timeseries_predictions`: array of numbers
        - `text`: string
      properties:
        type:
          $ref: "#/components/schemas/OutputType"
        result_consistent:
          type: boolean
          description: |
            True if all repetitions produced bit-identical outputs.
            False if any repetition differed (which may indicate
            non-determinism, numeric instability, or hardware faults).
          example: true
        outputs:
          type: array
          nullable: true
          description: |
            One output entry per input item. Null while the job is still
            running. Each entry's schema depends on `type` (see above).
          items: {}
        outputs_checksum:
          type: string
          nullable: true
          description: |
            SHA-256 hex digest of the `outputs` array (computed over its
            canonical JSON representation). Enables reproducibility
            verification across sessions without re-transferring outputs.
            Null while the job is running.
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

    # -------------------------------------------------------------------------
    # Shared
    # -------------------------------------------------------------------------

    JobStatusEnum:
      type: string
      enum: [accepted, running, complete, failed]
      description: |
        - `accepted`: Job received and queued, not yet started
        - `running`: Job is executing (repetitions in progress)
        - `complete`: All repetitions finished; metric and output fields
          reflect final values. Individual metric fields may still be `null`
          if the corresponding tool was unavailable.
        - `failed`: Infrastructure-level failure; the job could not run.
          The `error` field contains a description.

        Terminal states: `complete` and `failed`. Clients shall stop polling
        when the status is terminal.

    # -------------------------------------------------------------------------
    # Error
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, timestamp]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - TIMEOUT
                - UNAUTHORIZED
                - PAYLOAD_TOO_LARGE
                - INTERNAL_ERROR
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable error description.
            details:
              type: string
              description: Optional additional context.
            timestamp:
              type: string
              format: date-time
