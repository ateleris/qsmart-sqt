# sqt-reporter configuration
# Usage:
#   sqt-reporter run      -c sqt-reporter.example.yaml
#   sqt-reporter preflight -c sqt-reporter.example.yaml

project:
  name: "AI ML-L Qualification"
  version: "1.0.0"

test_specs:
  files:                            # one or more spec files; relative paths resolved against this file
    - ./specs/example.sqt.yaml      # REQ-ML-L-001: exit code + execution time
    - ./specs/REQ-ML-L-002.sqt.yaml # REQ-ML-L-002: peak RSS budget
    - ./specs/REQ-ML-L-003.sqt.yaml # REQ-ML-L-003: CPU budget + exit code
    - ./specs/REQ-ML-L-004.sqt.yaml # REQ-ML-L-004: binary size budget

runner:
  url: http://localhost:3000        # sqt-runner base URL (http:// or https://)
  # token_env: SQT_API_TOKEN        # optional: name of env var holding the bearer token

  # Optional tuning (values shown are the defaults; allowed range after #):
  # max_concurrent_jobs: 8          # >= 1
  # job_timeout_secs: 300           # >= 1
  # retry_max: 3                    # 0..=10
  # retry_backoff_initial_secs: 1   # 0..=60, doubles per retry
  # poll_interval_initial_secs: 1   # >= 1, doubles per poll
  # poll_interval_max_secs: 30      # >= poll_interval_initial_secs

report:
  output_dir: ./reports             # relative paths resolved against this file